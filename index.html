```html
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Tạm ngưng hoạt động</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
    }

    .box {
      text-align: center;
      padding: 40px;
      border-radius: 16px;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      box-shadow: 0 0 30px rgba(0,0,0,0.3);
      max-width: 500px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    p {
      color: #cbd5f5;
      margin: 8px 0;
    }

    .loader {
      margin: 25px auto;
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top: 4px solid #38bdf8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .footer {
      margin-top: 20px;
      font-size: 13px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>🚧 Website tạm ngưng</h1>
    <p>Hệ thống đang được rà soát và cập nhật.</p>
    <p>Vui lòng quay lại sau.</p>

    <div class="loader"></div>

    <div class="footer">
      Xin lỗi vì sự bất tiện này.
    </div>
  </div>
</body>
</html>
```
