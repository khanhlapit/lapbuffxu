<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lapbuffxu</title>
<link rel="icon" href="images/logo.png">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
    font-family: 'Inter', sans-serif;
    background: radial-gradient(circle at top, #1e293b, #020617);
    color:white;
    overflow-x:hidden;
}

/* HERO */
.hero {
    text-align:center;
    padding:100px 20px 50px;
    position:relative;
}

.hero::before {
    content:"";
    position:absolute;
    width:300px;
    height:300px;
    background: radial-gradient(circle, rgba(147,51,234,0.4), transparent);
    top:-100px;
    left:50%;
    transform:translateX(-50%);
    filter: blur(80px);
    pointer-events:none;
}

.logo img {
    height:65px;
    border-radius:14px;
    box-shadow:0 0 25px rgba(59,130,246,0.6);
}

.hero h1 {
    font-size:42px;
    margin-top:15px;
    background: linear-gradient(90deg,#60a5fa,#a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.hero p {
    color:#94a3b8;
    margin-top:10px;
}

/* CARD */
.card {
    background: rgba(255,255,255,0.03);
    backdrop-filter: blur(15px);
    border-radius:22px;
    padding:35px;
    border:1px solid rgba(255,255,255,0.08);
    text-align:center;
    transition:0.35s;
    position:relative;
    z-index:1;
}

.card::after {
    content:"";
    position:absolute;
    inset:0;
    border-radius:22px;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.1), transparent);
    opacity:0;
    transition:0.3s;
    pointer-events:none; /* FIX CLICK */
}

.card:hover::after {
    opacity:1;
}

.card:hover {
    transform:translateY(-10px) scale(1.03);
    box-shadow:0 0 40px rgba(99,102,241,0.3);
}

.card h2, .card h3 {
    margin-bottom:10px;
}

.card p {
    color:#94a3b8;
    font-size:14px;
}

.card a {
    display:inline-block;
    margin-top:18px;
    padding:11px 24px;
    background: linear-gradient(45deg,#3b82f6,#8b5cf6);
    border-radius:12px;
    color:white;
    text-decoration:none;
    font-weight:600;
    transition:0.3s;
    position:relative;
    z-index:2;
}

.card a:hover {
    transform:scale(1.1);
    box-shadow:0 0 20px rgba(139,92,246,0.7);
}

/* MAIN */
.main {
    max-width:900px;
    margin:50px auto;
    padding:45px;
}

.sub {
    max-width:900px;
    margin:25px auto;
}

/* CHAT FLOAT */
.chat-box {
    position:fixed;
    bottom:25px;
    right:25px;
}

.chat-main {
    width:65px;
    height:65px;
    border-radius:50%;
    background: linear-gradient(45deg,#3b82f6,#8b5cf6);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:26px;
    color:white;
    cursor:pointer;
    box-shadow:0 0 20px rgba(59,130,246,0.6);
    transition:0.3s;
}

.chat-main:hover {
    transform:scale(1.1);
}

.chat-menu {
    display:none;
    flex-direction:column;
    margin-bottom:12px;
}

.chat-menu a {
    background:#0f172a;
    color:white;
    padding:10px 15px;
    margin-top:8px;
    border-radius:12px;
    text-decoration:none;
    font-size:14px;
}

.chat-menu.active {
    display:flex;
}

/* SNOW */
.snowflake {
    position:fixed;
    top:-10px;
    color:white;
    font-size:10px;
    animation: fall linear infinite;
}

@keyframes fall {
    to {
        transform: translateY(100vh);
    }
}
</style>
</head>

<body>

<div class="hero">
    <div class="logo">
        <img src="images/logo.png">
    </div>

    <h1>Dịch Vụ Play Together</h1>
    <p>Tool miễn phí đang được dùng nhiều nhất hiện nay Hỗ trợ 24/7</p>
</div>

<div class="card main">
    <h2>Tải Tool</h2>
    <p>Miễn Phí - Update liên tục - Dễ sử dụng</p>
    <a href="./tai-game/index.html">Tải ngay</a>
</div>

<div class="card sub">
    <h3>Cày Thuê</h3>
    <p>Cày Nhanh - An toàn - Bảo Mật Cao</p>
    <a href="./cay-thue/index.html">Xem ngay</a>
</div>

<div class="chat-box">
    <div id="menu" class="chat-menu">
        <a href="https://zalo.me/0344792471" target="_blank">Zalo</a>
        <a href="https://t.me/sjxxtenn03" target="_blank">Telegram</a>
    </div>

    <div class="chat-main" onclick="toggleChat()">💬</div>
</div>

<script>
function createSnow() {
    const snow = document.createElement("div");
    snow.classList.add("snowflake");
    snow.innerHTML = "❄";

    snow.style.left = Math.random() * window.innerWidth + "px";
    snow.style.animationDuration = (3 + Math.random() * 5) + "s";
    snow.style.opacity = Math.random();

    document.body.appendChild(snow);

    setTimeout(() => snow.remove(), 8000);
}

setInterval(createSnow, 120);

function toggleChat() {
    document.getElementById("menu").classList.toggle("active");
}
</script>

</body>
</html>
