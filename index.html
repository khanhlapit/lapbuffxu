<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website Đang Bảo Trì</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#050816;
    position:relative;
    color:white;
}

/* Background */

body::before{
    content:"";
    position:absolute;
    width:900px;
    height:900px;
    background:
    radial-gradient(circle,#4f46e5 0%,transparent 60%);
    top:-250px;
    left:-250px;
    opacity:.5;
    animation:move1 10s ease-in-out infinite alternate;
}

body::after{
    content:"";
    position:absolute;
    width:700px;
    height:700px;
    background:
    radial-gradient(circle,#00e5ff 0%,transparent 60%);
    bottom:-250px;
    right:-200px;
    opacity:.4;
    animation:move2 12s ease-in-out infinite alternate;
}

@keyframes move1{
to{
transform:translate(120px,70px);
}
}

@keyframes move2{
to{
transform:translate(-100px,-80px);
}
}

.card{
    position:relative;
    width:90%;
    max-width:700px;
    padding:60px;
    text-align:center;

    background:rgba(255,255,255,.08);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.15);
    border-radius:25px;

    box-shadow:
    0 0 30px rgba(0,255,255,.15),
    0 0 60px rgba(79,70,229,.25);
}

.icon{
    font-size:70px;
    margin-bottom:20px;
    animation:rotate 6s linear infinite;
}

@keyframes rotate{
100%{
transform:rotate(360deg);
}
}

h1{
    font-size:46px;
    margin-bottom:15px;
    background:linear-gradient(90deg,#00e5ff,#7c4dff,#00e5ff);
    background-size:300%;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:text 5s linear infinite;
}

@keyframes text{
100%{
background-position:300%;
}
}

p{
    color:#d8d8d8;
    line-height:1.8;
    margin-bottom:30px;
}

.time{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-bottom:35px;
}

.box{
    width:90px;
    padding:15px;
    border-radius:18px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.08);
}

.box h2{
    font-size:30px;
}

.box span{
    font-size:13px;
    color:#aaa;
}

.btn{
    display:inline-block;
    text-decoration:none;
    color:white;
    padding:15px 35px;
    border-radius:40px;
    background:linear-gradient(90deg,#00c6ff,#7c4dff);
    transition:.35s;
    font-weight:600;
}

.btn:hover{
    transform:translateY(-5px);
    box-shadow:0 15px 35px rgba(124,77,255,.45);
}

.footer{
    margin-top:30px;
    color:#888;
    font-size:13px;
}

@media(max-width:700px){

.card{
padding:40px 20px;
}

h1{
font-size:32px;
}

.time{
flex-wrap:wrap;
}

.box{
width:80px;
}

}
</style>
</head>

<body>

<div class="card">

<div class="icon">⚙️</div>

<h1>Website Đang Bảo Trì</h1>

<p>
Xin chào 👋<br>
Website hiện đang được nâng cấp để mang đến trải nghiệm tốt hơn.
Vui lòng quay lại sau ít phút.
<br><br>
Cảm ơn bạn đã kiên nhẫn chờ đợi ❤️
</p>

<div class="time">

<div class="box">
<h2 id="day">00</h2>
<span>Ngày</span>
</div>

<div class="box">
<h2 id="hour">00</h2>
<span>Giờ</span>
</div>

<div class="box">
<h2 id="minute">00</h2>
<span>Phút</span>
</div>

<div class="box">
<h2 id="second">00</h2>
<span>Giây</span>
</div>

</div>

<a href="#" class="btn">Đang nâng cấp...</a>

<div class="footer">
© 2026 • Website Maintenance
</div>

</div>

<script>

const target = new Date();
target.setDate(target.getDate()+3);

function update(){

const now = new Date();

const diff = target-now;

if(diff<=0)return;

const d=Math.floor(diff/1000/60/60/24);

const h=Math.floor(diff/1000/60/60)%24;

const m=Math.floor(diff/1000/60)%60;

const s=Math.floor(diff/1000)%60;

day.innerHTML=String(d).padStart(2,"0");
hour.innerHTML=String(h).padStart(2,"0");
minute.innerHTML=String(m).padStart(2,"0");
second.innerHTML=String(s).padStart(2,"0");

}

setInterval(update,1000);

update();

</script>

</body>
</html>
