<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Website tạm ngưng</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
    }

    .container {
      text-align: center;
      padding: 50px 40px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      box-shadow: 0 0 40px rgba(0,0,0,0.4);
      max-width: 500px;
      width: 90%;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 15px;
    }

    p {
      color: #cbd5f5;
      margin: 10px 0;
      font-size: 15px;
    }

    .loader {
      margin: 30px auto;
      width: 55px;
      height: 55px;
      border: 5px solid rgba(255,255,255,0.15);
      border-top: 5px solid #38bdf8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .footer {
      margin-top: 25px;
      font-size: 13px;
      color: #94a3b8;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🚧 Website tạm ngưng</h1>
    <p>Hệ thống đang được rà soát và cập nhật.</p>
    <p>Vui lòng quay lại sau.</p>

    <div class="loader"></div>

    <div class="footer">
      Xin lỗi vì sự bất tiện này.
    </div>
  </div>
</body>
</html>
